[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-industrial-chatbot"
version = "1.0.0"
description = "AI Powered Multi Doc Conversational Chatbot Using RAG"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "MA Shahid" }
]
dependencies = [
  "streamlit>=1.35.0",
  "pandas>=2.2.0",
  "pypdf>=4.2.0",
  "python-docx>=1.1.0",
  "google-genai>=1.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
